[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "growthsathi-backend"
version = "0.1.0"
description = "GrowthSathi mock platform API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django==5.2.17",
  "djangorestframework==3.18.1",
  "djangorestframework-simplejwt[crypto]==5.5.1",
  "django-cors-headers>=4.7,<5",
  "dj-database-url>=2.3,<4",
  "drf-spectacular>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24; sys_platform != 'win32'",
  "google-auth>=2.59,<3",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "razorpay==2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-django>=4.10,<5",
  "ruff>=0.11,<1",
  "waitress==3.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", ".python-packages", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"
