name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:check-secrets

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: growthsathi_test
          POSTGRES_USER: growthsathi
          POSTGRES_PASSWORD: growthsathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growthsathi -d growthsathi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DATABASE_URL: postgresql://growthsathi:growthsathi@localhost:5432/growthsathi_test
      GOOGLE_CLIENT_ID: ci-readiness-check.apps.googleusercontent.com
      JWT_SECRET: ci-only-jwt-signing-key-at-least-thirty-two-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest
      - run: python manage.py spectacular --validate --file /tmp/openapi.yml
      - run: python manage.py check --deploy --settings=config.settings.production
