name: Format owner offers branch

on:
  push:
    branches: [feature/owner-offers-dashboard]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-offers-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/owner/api.ts frontend/src/owner/owner.css frontend/src/owner/OwnerLayout.tsx frontend/src/owner/OwnerOffersPage.tsx
          git commit -m "Format owner offers frontend"
          git push origin HEAD:feature/owner-offers-dashboard
